<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Warp</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 280px;
    background: #050a0f;
    color: #e0fff9;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    position: relative;
  }

  /* Scanlines effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,255,180,0.02) 2px,
      rgba(0,255,180,0.02) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .header {
    background: linear-gradient(135deg, #001a12, #002a1e);
    border-bottom: 1px solid #00ffcc33;
    padding: 16px 18px 14px;
    position: relative;
    overflow: hidden;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ffcc, transparent);
    animation: scanLine 3s linear infinite;
  }

  @keyframes scanLine {
    0% { transform: scaleX(0); transform-origin: left; }
    50% { transform: scaleX(1); transform-origin: left; }
    50.01% { transform: scaleX(1); transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 900;
    color: #00ffcc;
    letter-spacing: 2px;
    text-shadow: 0 0 20px #00ffcc88;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-icon { font-size: 22px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 10px #00ffcc; }
    50% { text-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc55; }
  }

  .tagline {
    font-size: 10px;
    color: #00ffcc66;
    margin-top: 3px;
    letter-spacing: 1px;
  }

  .body { padding: 16px; }

  /* Status */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #001a12;
    border: 1px solid #00ffcc22;
    border-radius: 6px;
    margin-bottom: 14px;
    font-size: 11px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #333;
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .status-dot.active {
    background: #00ffcc;
    box-shadow: 0 0 8px #00ffcc;
    animation: blink 1.5s ease-in-out infinite;
  }

  .status-dot.inactive { background: #ff4466; box-shadow: 0 0 8px #ff446699; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .status-text { color: #aad; flex: 1; }
  .status-text span { color: #00ffcc; font-weight: bold; }

  /* Speed control */
  .section-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #00ffcc55;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .speed-display {
    text-align: center;
    margin-bottom: 12px;
  }

  .speed-number {
    font-family: 'Orbitron', monospace;
    font-size: 42px;
    font-weight: 900;
    color: #00ffcc;
    text-shadow: 0 0 30px #00ffcc55;
    line-height: 1;
  }

  .speed-unit {
    font-size: 11px;
    color: #00ffcc66;
    margin-top: 2px;
  }

  /* Slider */
  .slider-wrap { margin-bottom: 14px; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #00ffcc var(--pct, 47%), #001a12 var(--pct, 47%));
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #00ffcc;
    box-shadow: 0 0 12px #00ffcc88;
    cursor: pointer;
    transition: transform 0.1s;
  }

  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  .speed-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #00ffcc44;
    margin-top: 4px;
  }

  /* Preset buttons */
  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }

  .preset-btn {
    background: #001a12;
    border: 1px solid #00ffcc22;
    color: #00ffcc88;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 6px 4px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .preset-btn:hover, .preset-btn.active {
    background: #00ffcc15;
    border-color: #00ffcc;
    color: #00ffcc;
    box-shadow: 0 0 8px #00ffcc33;
  }

  /* Main buttons */
  .btn-activate {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
  }

  .btn-activate.start {
    background: linear-gradient(135deg, #00cc99, #00ffcc);
    color: #001a12;
    box-shadow: 0 4px 20px #00ffcc44;
  }

  .btn-activate.start:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px #00ffcc66;
  }

  .btn-activate.start:active { transform: translateY(0); }

  .btn-activate.stop {
    background: transparent;
    border: 1px solid #ff446666;
    color: #ff4466;
  }

  .btn-activate.stop:hover {
    background: #ff446611;
    border-color: #ff4466;
  }

  /* Info footer */
  .info {
    margin-top: 10px;
    padding: 8px 10px;
    background: #001a0d;
    border: 1px solid #00ffcc11;
    border-radius: 4px;
    font-size: 9px;
    color: #00ffcc44;
    line-height: 1.6;
    text-align: center;
  }

  .warning {
    font-size: 9px;
    color: #ffcc0066;
    text-align: center;
    margin-top: 6px;
    line-height: 1.5;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ffcc22, transparent);
    margin: 12px 0;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="logo-icon">⚡</span> TIME WARP
  </div>
  <div class="tagline">GAME SPEED ACCELERATOR</div>
</div>

<div class="body">

  <div class="status-bar">
    <div class="status-dot inactive" id="statusDot"></div>
    <div class="status-text" id="statusText">INACTIVE — Click ACTIVATE</div>
  </div>

  <div class="section-label">Speed Multiplier</div>

  <div class="speed-display">
    <div class="speed-number" id="speedDisplay">10</div>
    <div class="speed-unit">× FASTER THAN REAL TIME</div>
  </div>

  <div class="slider-wrap">
    <input type="range" id="speedSlider" min="2" max="50" value="10" step="1">
    <div class="speed-labels"><span>2×</span><span>10×</span><span>25×</span><span>50×</span></div>
  </div>

  <div class="section-label">Presets</div>
  <div class="presets">
    <button class="preset-btn" data-speed="2">2×</button>
    <button class="preset-btn active" data-speed="10">10×</button>
    <button class="preset-btn" data-speed="20">20×</button>
    <button class="preset-btn" data-speed="50">50×</button>
  </div>

  <button class="btn-activate start" id="activateBtn">⚡ ACTIVATE</button>
  <button class="btn-activate stop" id="stopBtn" style="display:none">⏹ STOP (Reload to Reset)</button>

  <div class="info">
    Overrides Date, setTimeout, setInterval &amp; performance.now<br>
    Game timers run at full speed × multiplier
  </div>

  <div class="warning">
    ⚠ Reload the page to fully stop time warp
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
